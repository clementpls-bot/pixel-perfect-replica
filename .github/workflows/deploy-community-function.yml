name: Deploy community publishing function

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pastel-can-wall-drinks-brand-cleanup
    paths:
      - "supabase/functions/publish-community-post/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-community-function.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      # OPENAI_API_KEY is configured once in the Supabase Dashboard.
      # Keeping secret management out of this workflow avoids requiring
      # edge_functions_secrets_write permission for every deployment.
      - name: Deploy publishing function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy publish-community-post --project-ref illepqwnragqmgkwehdp
